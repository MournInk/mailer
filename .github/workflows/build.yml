name: Build

# Desktop artifacts are real installers. Android produces an installable APK.
# iOS is a compile check only: Apple requires a signing identity to produce an
# .ipa, and this workflow does not assume one exists.
on:
  push:
    tags: ["v*"]
    # Development branches build too, so installers are downloadable from the
    # run without waiting for a release tag. Only tagged runs draft a release.
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            artifact: mailer-macos-universal
          - name: Windows (x64)
            os: windows-latest
            rust-targets: ""
            args: ""
            artifact: mailer-windows-x64
          # 22.04 keeps the glibc floor low enough for older distros.
          - name: Linux (x64)
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
            artifact: mailer-linux-x64

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - run: npm ci

      - name: Build application
        run: npm run tauri build -- ${{ matrix.args }}

      # The workspace puts target/ at the repo root; a --target build nests one
      # directory deeper, so both shapes are collected.
      - name: Collect installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/*/release/bundle/**/*.deb
            target/*/release/bundle/**/*.rpm
            target/*/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.dmg
            target/*/release/bundle/**/*.msi
            target/*/release/bundle/**/*.exe

  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # The runner image ships an NDK already. Fetching one with
      # nttld/setup-ndk + local-cache restored a toolchain whose
      # aarch64-linux-android*-clang wrapper pointed at a `clang` the cache had
      # dropped, so every cc-rs compile died with status 127.
      - name: Locate the runner's NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ndk" ] || [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "No usable NDK on this runner (looked at '$ndk')" >&2
            exit 1
          fi
          echo "Using NDK at $ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - run: npm ci

      # gen/android is generated, not committed, so it has to be created here.
      - name: Initialize Android project
        run: npm run tauri android init -- --ci

      # An unsigned release APK cannot be installed, and this workflow carries
      # no keystore, so the artifact is the debug-signed build. Shipping to a
      # store means adding a keystore and switching this to `--release`.
      - name: Build APK
        run: npm run tauri android build -- --debug --apk

      - name: Collect APK
        uses: actions/upload-artifact@v6
        with:
          name: mailer-android-debug
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS (Rust compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - run: npm ci

      # What this job can and cannot prove:
      #
      # A distributable .ipa needs an Apple signing identity, which this
      # workflow deliberately does not carry. Driving the generated Xcode
      # project directly does not substitute for it either — Tauri's "Build
      # Rust Code" phase shells out to `tauri ios xcode-script`, which in a
      # Debug build expects the dev-server address file that only `tauri ios
      # dev` writes, so it aborts.
      #
      # So this job verifies the layers we actually own: the web bundle builds,
      # and the Rust library compiles and links for both a real device and the
      # simulator. Packaging is out of scope until signing material exists.
      - name: Build web assets
        run: npm run build

      - name: Compile the Rust library for iOS
        run: |
          cargo build --package mailer --lib --target aarch64-apple-ios
          cargo build --package mailer --lib --target aarch64-apple-ios-sim

  release:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Drafted rather than published: the maintainer decides when it goes out.
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
