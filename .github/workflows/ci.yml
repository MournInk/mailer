name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The portable crates only. `--workspace` would pull in src-tauri, whose
      # build needs GTK/WebKit — libraries this matrix deliberately does not
      # install, since its job is proving the engine works on all three OSes.
      # The workspace-wide check lives in the `tauri` job, which has them.
      - name: Test portable crates
        run: cargo test -p mailer-core -p mailer-mcp

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  tauri:
    name: Tauri desktop check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The whole workspace, and every target: a field added to a type in
      # mailer-core is constructed in src-tauri, so checking only the crate you
      # edited proves nothing. This is the job that has the system libraries to
      # compile all of it, so this is where that check belongs.
      - name: Check the whole workspace
        run: cargo check --workspace --all-targets
