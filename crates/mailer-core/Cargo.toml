[package]
name = "mailer-core"
description = "Core engine for Mailer: mail protocols (IMAP/POP3/SMTP), AI triage, storage and notification channels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

# storage
# 0.38+ pulls libsqlite3-sys that needs Rust 1.95's `cfg_select`; stay on 0.37
# until the toolchain catches up.
rusqlite = { version = "0.37", features = ["bundled"] }

# mail
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# full_encoding pulls in encoding_rs. Without it only UTF-8 and a handful of
# charsets decode, so a GB2312/GBK subject — anything from a Chinese sender —
# arrives as replacement characters.
mail-parser = { version = "0.11", features = ["full_encoding"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "pool",
    "tokio1",
    "tokio1-rustls-tls",
] }

# TLS (rustls everywhere: no OpenSSL, mobile-friendly cross compilation)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"

# http (LLM API + notification channels)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
